[package]
name = "backlog-api"
description = "Minimal Backlog API client for documents"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
ts-rs.workspace = true
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
