name: Build macOS app

on:
  # Publishing a release (create it in the Releases UI with a new v* tag and
  # "Generate release notes") builds the app and attaches the .dmg to it.
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/build-macos.yml"]
  workflow_dispatch:

permissions:
  contents: write # upload the .dmg to the release

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # For a release, the app version comes from the tag (v0.2.0 -> 0.2.0),
      # so the version files don't need a commit before releasing.
      - name: Set the app version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      # Builds a universal app (Apple Silicon + Intel). For a release it also
      # uploads the .dmg to that release.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: backlog-document-desktop-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
