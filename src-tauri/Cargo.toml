[package]
name = "backlog-document-desktop"
description = "Desktop client for Backlog documents"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "backlog_document_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backlog-api = { path = "../crates/backlog-api" }
doc-sync-engine = { path = "../crates/doc-sync-engine" }
keyring = "4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
ts-rs.workspace = true
